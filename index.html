<script type="application/json" id="docs">[{"doc": "Anggaran Dasar", "items": [{"t": "MUKADIMAH", "h": "\u003cp>Team Terabas lahir dari semangat kebersamaan anak muda Kelubagolit. Tim ini digagas sekitar 17 Agustus 2025, setelah kegiatan kemah Pramuka di Adobala, dengan nama awal \"Tim Sementara\" untuk mempersiapkan Kelubagolit sebagai tuan rumah Kemah Pramuka se-Kabupaten Flores Timur.\u003c/p>\n\u003cp>Seiring waktu, kelompok ini sepakat memakai nama TEAM TERABAS: tim yang berada di garis terdepan, siap menghadapi tantangan, siap bergerak, dan kuat dalam kekompakan. Dengan rahmat Tuhan Yang Maha Esa, kami menyusun Anggaran Dasar ini sebagai pedoman bersama.\u003c/p>"}, {"t": "BAB I. NAMA, WAKTU, DAN KEDUDUKAN", "h": "\u003cp>\u003cstrong>Pasal 1. Nama\u003c/strong>\u003c/p>\n\u003cp>Organisasi ini bernama \u003cstrong>Team Terabas Kelubagolit\u003c/strong>, selanjutnya disebut Team Terabas.\u003c/p>\n\u003cp>\u003cstrong>Pasal 2. Waktu\u003c/strong>\u003c/p>\n\u003cp>Team Terabas digagas pada 17 Agustus 2025 dan didirikan untuk waktu yang tidak ditentukan.\u003c/p>\n\u003cp>\u003cstrong>Pasal 3. Kedudukan\u003c/strong>\u003c/p>\n\u003cp>Team Terabas berkedudukan di Kecamatan Kelubagolit, Kabupaten Flores Timur, Provinsi Nusa Tenggara Timur.\u003c/p>"}, {"t": "BAB II. ASAS, SIFAT, DAN SEMBOYAN", "h": "\u003cp>\u003cstrong>Pasal 4. Asas\u003c/strong>\u003c/p>\n\u003cp>Team Terabas berasaskan Pancasila, Undang-Undang Dasar Negara Republik Indonesia Tahun 1945, serta Trisatya dan Dasadarma Pramuka.\u003c/p>\n\u003cp>\u003cstrong>Pasal 5. Sifat\u003c/strong>\u003c/p>\n\u003cp>Team Terabas bersifat kekeluargaan, mandiri, terbuka, dan tidak berafiliasi dengan partai politik mana pun.\u003c/p>\n\u003cp>\u003cstrong>Pasal 6. Semboyan dan Nilai\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Semboyan Team Terabas adalah \u003cstrong>\"Loyalitas Tanpa Batas\"\u003c/strong>.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Nilai utama Team Terabas: kompak, solid, disiplin, saling mendukung, dan siap bergerak bersama.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB III. TUJUAN DAN KEGIATAN", "h": "\u003cp>\u003cstrong>Pasal 7. Tujuan\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Mempererat persaudaraan dan kekompakan anggota.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Membina disiplin, tanggung jawab, dan jiwa kepemimpinan anggota melalui nilai-nilai kepramukaan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Meningkatkan keterampilan anggota, termasuk keterampilan teknologi dan media digital.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Berperan aktif dalam kegiatan sosial dan pembangunan di Kelubagolit dan sekitarnya.\u003c/p>\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Pasal 8. Kegiatan\u003c/strong>\u003c/p>\n\u003cp>Untuk mencapai tujuan, Team Terabas melaksanakan:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Pertemuan rutin bulanan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Kegiatan kepramukaan dan pelatihan keterampilan dengan mengundang narasumber.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Kegiatan berbasis teknologi: pengelolaan grup dan data anggota secara digital, dokumentasi kegiatan, serta media sosial tim.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Kegiatan sosial, kemasyarakatan, dan kegiatan lain yang sah dan tidak bertentangan dengan aturan.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB IV. LAMBANG DAN ATRIBUT", "h": "\u003cp>\u003cstrong>Pasal 9\u003c/strong>\u003c/p>\n\u003cp>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Lambang Team Terabas berbentuk lingkaran dengan tulisan \"TEAM TERABAS\" di bagian atas dan \"KELUBAGOLIT\" di bagian bawah. Di tengahnya ada latar merah putih, dua kepalan tangan yang saling menggenggam erat, setangkai padi di kiri, setangkai kapas di kanan, serta tunas kelapa di dalam periuk tanah pada sisi kiri dan kanan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Warna lambang adalah merah, putih, kuning, hijau, cokelat, dan hitam.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Makna lambang dan ketentuan kostum tim diatur dalam Anggaran Rumah Tangga.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB V. KEANGGOTAAN", "h": "\u003cp>\u003cstrong>Pasal 10\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Anggota Team Terabas adalah warga yang menyatakan diri bergabung, menyetujui AD/ART, dan diterima oleh pengurus.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Syarat, hak, kewajiban, dan berakhirnya keanggotaan diatur dalam Anggaran Rumah Tangga.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB VI. KEPENGURUSAN", "h": "\u003cp>\u003cstrong>Pasal 11. Susunan Pengurus\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Pengurus Team Terabas terdiri dari Penasihat, Ketua, Sekretaris, dan Bendahara.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Penasihat Team Terabas adalah Camat Kelubagolit dan Ketua Kwartir Ranting (Kwaran) Kelubagolit.\u003c/p>\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Pasal 12. Masa Bakti\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Masa bakti pengurus adalah 4 (empat) tahun.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Pengurus dapat dipilih kembali paling banyak untuk 1 (satu) kali masa bakti berikutnya pada jabatan yang sama.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB VII. MUSYAWARAH DAN RAPAT", "h": "\u003cp>\u003cstrong>Pasal 13\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Musyawarah Anggota adalah kekuasaan tertinggi Team Terabas dan diadakan sekali dalam 4 (empat) tahun.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Musyawarah Anggota Luar Biasa dapat diadakan bila diusulkan oleh paling sedikit 2/3 anggota.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Rapat lain terdiri dari rapat pengurus dan pertemuan rutin bulanan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Keputusan diambil secara musyawarah untuk mufakat. Bila tidak tercapai, keputusan diambil dengan suara terbanyak.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB VIII. KEUANGAN", "h": "\u003cp>\u003cstrong>Pasal 14\u003c/strong>\u003c/p>\n\u003cp>Keuangan Team Terabas berasal dari:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Iuran anggota.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Denda sesuai kesepakatan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Sumbangan yang sah dan tidak mengikat.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Usaha lain yang sah.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB IX. PERUBAHAN AD/ART", "h": "\u003cp>\u003cstrong>Pasal 15\u003c/strong>\u003c/p>\n\u003cp>Perubahan Anggaran Dasar dan Anggaran Rumah Tangga hanya dapat dilakukan dalam Musyawarah Anggota yang dihadiri paling sedikit 2/3 anggota dan disetujui lebih dari setengah anggota yang hadir.\u003c/p>"}, {"t": "BAB X. PEMBUBARAN", "h": "\u003cp>\u003cstrong>Pasal 16\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Team Terabas hanya dapat dibubarkan melalui Musyawarah Anggota Luar Biasa yang khusus diadakan untuk itu, dihadiri dan disetujui paling sedikit 3/4 anggota.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Bila dibubarkan, harta kekayaan tim diserahkan kepada Kwartir Ranting (Kwaran) Kelubagolit sesuai keputusan musyawarah.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB XI. PENUTUP", "h": "\u003cp>\u003cstrong>Pasal 17\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Hal yang belum diatur dalam Anggaran Dasar ini diatur dalam Anggaran Rumah Tangga dan peraturan lain yang tidak bertentangan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Anggaran Dasar ini berlaku sejak ditetapkan.\u003c/p>\u003c/li>\n\u003c/ol>"}]}, {"doc": "Anggaran Rumah Tangga", "items": [{"t": "BAB I. LAMBANG DAN KOSTUM", "h": "\u003cp>\u003cstrong>Pasal 1. Makna Lambang\u003c/strong>\u003c/p>\n\u003cp>Lambang Team Terabas adalah simbol persaudaraan, kesetiaan, persatuan, dan semangat pengabdian yang berakar dari Gerakan Pramuka Kelubagolit. Setiap unsurnya bermakna sebagai berikut:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>\u003cstrong>Kepalan tangan yang saling menggenggam (persatuan, solidaritas, dan loyalitas):\u003c/strong> melambangkan kekuatan, keberanian, persatuan, dan tekad yang teguh. Tangan yang saling menggenggam menggambarkan persaudaraan yang kuat, kesediaan untuk saling menopang, dan komitmen untuk tetap bersama menghadapi setiap tantangan. Kekuatan sejati tidak hanya terletak pada kemampuan individu, tetapi pada kebersamaan dan kesetiaan seluruh anggota. \u003cem>Makna utama: bersatu dalam semangat, setia dalam persaudaraan, dan kuat dalam perjuangan.\u003c/em>\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Padi (kerja keras, kemakmuran, dan kerendahan hati):\u003c/strong> melambangkan kehidupan, kesejahteraan, kerja keras, dan harapan akan masa depan yang lebih baik. Padi mengajarkan kerendahan hati: semakin berisi, semakin merunduk. Setiap anggota diingatkan untuk terus belajar, bekerja keras, dan bermanfaat bagi sesama tanpa kehilangan sikap rendah hati. \u003cem>Makna utama: bertumbuh melalui kerja keras, berhasil tanpa kesombongan, dan bermanfaat bagi banyak orang.\u003c/em>\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Kapas (kesucian hati, kedamaian, dan kepedulian):\u003c/strong> melambangkan kelembutan hati, ketulusan, kedamaian, dan kepedulian terhadap sesama. Kapas juga menjadi simbol keseimbangan antara kekuatan dan kelembutan: anggota berani bertindak, tetapi tetap mengedepankan kemanusiaan, persaudaraan, dan rasa hormat. \u003cem>Makna utama: berjiwa kuat, berhati tulus, dan selalu peduli terhadap sesama.\u003c/em>\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Tunas kelapa (semangat kepramukaan, ketangguhan, dan pengabdian):\u003c/strong> lambang Gerakan Pramuka Indonesia, yang menegaskan asal-usul dan akar kepramukaan Team Terabas. Tunas kelapa menggambarkan generasi muda yang tangguh, mudah beradaptasi, bercita-cita tinggi, dan siap memberi manfaat di mana pun berada, dengan berpegang pada Dasadarma Pramuka, disiplin, kemandirian, tanggung jawab, dan pengabdian. \u003cem>Makna utama: tetap tangguh menghadapi perubahan, berpegang pada nilai kepramukaan, dan mengabdi tanpa pamrih.\u003c/em>\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Periuk tanah (akar budaya, identitas, dan persaudaraan):\u003c/strong> melambangkan akar budaya, kesederhanaan, kebersamaan, dan identitas lokal masyarakat Kelubagolit. Sebagai wadah, periuk menyatukan berbagai unsur menjadi satu kesatuan yang utuh: anggota dengan latar belakang yang berbeda dipersatukan oleh persaudaraan dan nilai yang sama. Seperti periuk yang dibentuk melalui proses, persaudaraan tumbuh melalui pengalaman, pengorbanan, kepercayaan, dan perjalanan bersama. \u003cem>Makna utama: berakar pada budaya sendiri, menjaga identitas, dan merawat persaudaraan dalam satu wadah kebersamaan.\u003c/em>\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Warna:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Merah dan putih:\u003c/strong> nasionalisme, keberanian, ketulusan, serta cinta kepada Tanah Air dan Negara Kesatuan Republik Indonesia.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Kuning keemasan:\u003c/strong> kejayaan, harapan, semangat, dan cita-cita luhur yang ingin dicapai bersama.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Hijau:\u003c/strong> kehidupan, pertumbuhan, kesegaran, dan harapan untuk terus berkembang.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Hitam:\u003c/strong> keteguhan, kekuatan karakter, kewibawaan, dan pendirian yang kokoh.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Cokelat:\u003c/strong> bumi, kesederhanaan, kedekatan dengan alam, dan akar budaya Kelubagolit.\u003c/p>\u003c/li>\n\u003c/ul>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Nama TEAM TERABAS KELUBAGOLIT:\u003c/strong> \u003cem>Team\u003c/em> berarti setiap anggota adalah bagian dari satu kesatuan yang saling melengkapi. \u003cem>Terabas\u003c/em> berarti semangat untuk terus melangkah, membuka jalan, berani menghadapi rintangan, dan tidak mudah menyerah. \u003cem>Kelubagolit\u003c/em> menegaskan identitas daerah dan akar persaudaraan tempat tumbuhnya semangat tim.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Semboyan \"Loyalitas Tanpa Batas\":\u003c/strong> loyalitas adalah kesetiaan yang dibangun atas ketulusan, kepercayaan, tanggung jawab, dan persaudaraan; \u003cem>tanpa batas\u003c/em> berarti semangat itu tidak terhalang oleh jarak, waktu, keadaan, maupun tantangan. Loyalitas sejati tetap berlandaskan kebaikan, kejujuran, tanggung jawab, dan penghormatan terhadap sesama, bukan membenarkan segala sesuatu tanpa pertimbangan.\u003c/p>\u003c/li>\n\u003c/ol>\n\u003cp>Secara keseluruhan, lambang Team Terabas menegaskan bahwa tim ini \u003cstrong>berakar pada Pramuka, bersatu dalam persaudaraan, setia dalam pengabdian, dan melangkah bersama tanpa menyerah.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>Pasal 2. Kostum Tim\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Kostum resmi adalah baju Team Terabas kaos dan/atau kemeja berwarna hitam.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Kostum wajib dipakai pada setiap pertemuan rutin dan kegiatan resmi tim.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB II. KEANGGOTAAN", "h": "\u003cp>\u003cstrong>Pasal 3. Syarat Anggota\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Warga Kelubagolit atau sekitarnya yang berusia paling rendah 17 tahun.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Menyatakan diri bergabung dan bersedia mematuhi AD/ART serta kesepakatan tim.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Disetujui oleh pengurus dan dicatat dalam daftar anggota.\u003c/p>\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Pasal 4. Hak Anggota\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Mengikuti seluruh kegiatan tim.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Menyampaikan pendapat, usul, dan kritik.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Memilih dan dipilih menjadi pengurus.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Berhak menerima pelayanan dari organisasi.\u003c/p>\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Pasal 5. Kewajiban Anggota\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Mematuhi AD/ART dan kesepakatan tim.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Membayar iuran tepat waktu.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Hadir dalam pertemuan rutin dan kegiatan tim.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Menjaga nama baik dan kekompakan Team Terabas.\u003c/p>\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Pasal 6. Berakhirnya Keanggotaan\u003c/strong>\u003c/p>\n\u003cp>Keanggotaan berakhir karena:\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Meninggal dunia.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Mengundurkan diri secara tertulis atau lisan melalui pengurus.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Diberhentikan oleh rapat pengurus karena melanggar AD/ART secara berat, setelah diberi teguran 3 (Tiga) kali.\u003c/p>\u003c/li>\n\u003c/ol>\n\u003cp>Anggota yang keluar wajib menyelesaikan iuran dan denda yang belum dibayar terlebih dahulu.\u003c/p>"}, {"t": "BAB III. PENGURUS DAN TUGASNYA", "h": "\u003cp>\u003cstrong>Pasal 7. Susunan Pengurus Masa Bakti 2026–2030\u003c/strong>\u003c/p>\n\u003ctable>\n\n\u003cthead>\n\u003ctr>\n\u003cth>Jabatan\u003c/th>\n\u003cth>Nama\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Penasihat\u003c/td>\n\u003ctd>Camat Kelubagolit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Penasihat\u003c/td>\n\u003ctd>Ketua Kwaran Kelubagolit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ketua\u003c/td>\n\u003ctd>Silvanus Bali Ohin, S.Pd.Gr\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sekretaris\u003c/td>\n\u003ctd>Antonius Lambertus Asan Boro\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bendahara\u003c/td>\n\u003ctd>Mustari Peka Suban, S.Pd.Gr\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Pengurus dikukuhkan Pertama kalinya pada 30 Oktober 2026, bertepatan dengan peringatan Sumpah Pemuda.\u003c/p>\n\u003cp>\u003cstrong>Pasal 8. Tugas Pengurus\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>\u003cstrong>Penasihat:\u003c/strong> memberi arahan, nasihat, dan pertimbangan kepada pengurus.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Ketua:\u003c/strong> memimpin tim dan rapat, mengoordinasikan program kerja, dan mewakili tim ke luar.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Sekretaris:\u003c/strong> mengurus surat-menyurat, notulen, daftar hadir, dan arsip; mengelola data anggota dan dokumentasi secara digital; serta mewakili Ketua apabila Ketua berhalangan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Bendahara:\u003c/strong> menerima, menyimpan, dan mengeluarkan uang atas persetujuan Ketua; membuat laporan keuangan dan melaporkannya setiap bulan dan pada akhir tahun; serta mewakili Ketua apabila Ketua dan Sekretaris berhalangan.\u003c/p>\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Pasal 9. Pergantian Pengurus Antarwaktu\u003c/strong>\u003c/p>\n\u003cp>Bila pengurus berhalangan tetap atau mengundurkan diri, rapat pengurus bersama anggota menunjuk penggantinya sampai akhir masa bakti.\u003c/p>"}, {"t": "BAB IV. PERTEMUAN DAN IURAN", "h": "\u003cp>\u003cstrong>Pasal 10. Pertemuan Rutin\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Pertemuan rutin diadakan setiap \u003cstrong>Minggu ketiga\u003c/strong> setiap bulan, pukul \u003cstrong>17.30\u003c/strong> tepat.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Tempat pertemuan ditentukan bersama oleh pengurus dan anggota.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Pertemuan rutin adalah sarana agar anggota selalu berkumpul, berkomunikasi, dan menjaga kekompakan.\u003c/p>\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Pasal 11. Iuran Anggota\u003c/strong>\u003c/p>\n\u003cp>Setiap anggota Team Terabas wajib membayar iuran setiap bulan, dengan rincian:\u003c/p>\n\u003ctable>\n\n\u003cthead>\n\u003ctr>\n\u003cth>Pos\u003c/th>\n\u003cth>Jumlah\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Iuran tim\u003c/td>\n\u003ctd>Rp5.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Konsumsi pertemuan\u003c/td>\n\u003ctd>Rp10.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Rp15.000\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>"}, {"t": "BAB V. ATURAN DAN SANKSI", "h": "\u003cp>\u003cstrong>Pasal 12. Denda\u003c/strong>\u003c/p>\n\u003ctable>\n\n\u003cthead>\n\u003ctr>\n\u003cth>Pelanggaran\u003c/th>\n\u003cth>Denda\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Tidak memakai kostum Team Terabas saat pertemuan\u003c/td>\n\u003ctd>Rp5.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Datang terlambat\u003c/td>\n\u003ctd>Rp5.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tidak hadir, iuran dititipkan\u003c/td>\n\u003ctd>Rp10.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tidak hadir tanpa alasan\u003c/td>\n\u003ctd>Rp20.000\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tidak hadir dengan alasan khusus yang dapat dipertanggungjawabkan\u003c/td>\n\u003ctd>Rp0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Pasal 13. Ketentuan Sanksi\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Denda dibayar pada pertemuan itu juga atau paling lambat pada pertemuan berikutnya.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Alasan khusus disampaikan kepada Ketua atau Sekretaris sebelum pertemuan dimulai.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Sanksi bukan untuk menghukum, tetapi untuk menjaga disiplin, tanggung jawab, dan kekompakan.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB VI. KEUANGAN DAN PELAPORAN", "h": "\u003cp>\u003cstrong>Pasal 14\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Iuran tim dan uang denda masuk ke kas Team Terabas.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Uang konsumsi dipakai untuk konsumsi pertemuan bulan berjalan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Bendahara mencatat semua uang masuk dan keluar, dan disarankan memakai Google Sheets agar mudah dicek anggota.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Bendahara menyampaikan laporan kas setiap pertemuan rutin dan membagikannya di grup WhatsApp tim.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Setiap pengeluaran kas harus disetujui oleh Ketua.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB VII. KEGIATAN DAN TEKNOLOGI", "h": "\u003cp>\u003cstrong>Pasal 15. Kegiatan Kepramukaan\u003c/strong>\u003c/p>\n\u003cp>Mengagendakan kegiatan kepramukaan, termasuk mengundang narasumber untuk memberi pelatihan sesuai kebutuhan minimal 2 (dua) kali dalam setahun.\u003c/p>\n\u003cp>\u003cstrong>Pasal 16. Pemanfaatan Teknologi\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Grup WhatsApp tim menjadi saluran resmi untuk undangan, pengumuman, dan laporan.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Data anggota, daftar hadir, dan catatan keuangan disimpan secara digital (misalnya Google Sheets/Drive) dan dapat diakses pengurus.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Setiap kegiatan didokumentasikan (foto/video) dan dapat dibagikan di media sosial tim dengan tetap menjaga nama baik tim.\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "BAB VIII. PROGRAM KERJA", "h": "\u003cp>\u003cstrong>Pasal 17\u003c/strong>\u003c/p>\n\u003cp>Program kerja disusun untuk satu tahun, dibahas bersama anggota, dan dievaluasi setiap akhir tahun.\u003c/p>"}, {"t": "BAB IX. PENUTUP", "h": "\u003cp>\u003cstrong>Pasal 18\u003c/strong>\u003c/p>\n\u003col type=\"1\">\n\u003cli>\u003cp>Hal yang belum diatur dalam ART ini diputuskan dalam rapat pengurus atau pertemuan rutin.\u003c/p>\u003c/li>\n\u003cli>\u003cp>Anggaran Rumah Tangga ini berlaku sejak ditetapkan\u003c/p>\u003c/li>\n\u003c/ol>"}, {"t": "Pengesahan", "h": "\u003cblockquote>\n\u003cp>Ditetapkan di: Kelubagolit\u003c/p>\n\u003cp>Pada tanggal: 30 Oktober 2026\u003c/p>\n\u003c/blockquote>\n\u003ctable>\n\n\u003cthead>\n\u003ctr>\n\u003cth>Ketua\u003c/th>\n\u003cth>Sekretaris\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Silvanus Bali Ohin, S.Pd.Gr\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Antonius Lambertus Asan Boro\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Mengetahui,\u003c/p>\n\u003ctable>\n\n\u003cthead>\n\u003ctr>\n\u003cth>Penasihat\u003c/th>\n\u003cth>Penasihat\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Camat Kelubagolit\u003c/td>\n\u003ctd>Ketua Kwartir Ranting Kelubagolit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Videlis Molan Tokan, SST\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Lusius Rangan Belo, S.Pd.SD\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>"}]}, {"doc": "Peraturan Arisan", "items": [{"t": "Pembukaan", "h": "\u003cp>\u003cstrong>Ketetapan Pertemuan Team Terabas Kelubagolit tentang Peraturan Arisan Team Terabas\u003c/strong> (nomor belum diisi).\u003c/p>\u003cp>Peraturan ini mengatur arisan Team Terabas Kelubagolit. Arisan tidak termasuk dalam AD/ART. Arisan adalah kegiatan pendukung untuk anggota yang ingin ikut, supaya anggota selalu berkumpul dan berkomunikasi.\u003c/p>"}, {"t": "BAB I. KETENTUAN UMUM", "h": "\u003cp>\u003cstrong>Pasal 1. Sifat Arisan\u003c/strong>\u003c/p>\u003col>\u003cli>Arisan Team Terabas bersifat sukarela. Tidak semua anggota Team Terabas wajib ikut arisan.\u003c/li>\u003cli>Anggota yang tidak ikut arisan tetap wajib membayar iuran dan mematuhi denda sesuai ART Team Terabas.\u003c/li>\u003cli>Arisan dikelola oleh pengurus Team Terabas: Ketua, Sekretaris, dan Bendahara.\u003c/li>\u003c/ol>"}, {"t": "BAB II. PESERTA", "h": "\u003cp>\u003cstrong>Pasal 2. Syarat Peserta\u003c/strong>\u003c/p>\u003col>\u003cli>Peserta arisan adalah anggota Team Terabas yang mendaftar kepada Sekretaris.\u003c/li>\u003cli>Peserta wajib ikut sampai satu periode arisan selesai, yaitu sampai semua peserta mendapat giliran.\u003c/li>\u003cli>Peserta baru hanya bisa masuk pada awal periode, kecuali disepakati lain oleh peserta dalam pertemuan.\u003c/li>\u003c/ol>"}, {"t": "BAB III. SETORAN", "h": "\u003cp>\u003cstrong>Pasal 3. Besar Setoran\u003c/strong>\u003c/p>\u003cp>Setiap peserta menyetor Rp65.000 setiap bulan, dengan rincian:\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Pos\u003c/th>\u003cth>Jumlah\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Uang arisan\u003c/td>\u003ctd>Rp50.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Iuran tim\u003c/td>\u003ctd>Rp5.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Konsumsi\u003c/td>\u003ctd>Rp10.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Total\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Rp65.000\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Iuran tim dan konsumsi dalam setoran ini sudah termasuk iuran bulanan sesuai ART, jadi peserta tidak membayar dua kali.\u003c/p>\u003cp>\u003cstrong>Pasal 4. Uang Arisan per Putaran\u003c/strong>\u003c/p>\u003cp>Uang arisan yang diterima pada setiap putaran adalah jumlah peserta × Rp50.000.\u003c/p>"}, {"t": "BAB IV. JADWAL DAN TEMPAT", "h": "\u003cp>\u003cstrong>Pasal 5\u003c/strong>\u003c/p>\u003col>\u003cli>Arisan dilaksanakan bersama pertemuan rutin, setiap Minggu ketiga setiap bulan, pukul 17.30 tepat.\u003c/li>\u003cli>Tempat arisan bergiliran di rumah peserta yang mendapat arisan.\u003c/li>\u003c/ol>"}, {"t": "BAB V. PENARIKAN ARISAN", "h": "\u003cp>\u003cstrong>Pasal 6. Cara Penarikan\u003c/strong>\u003c/p>\u003col>\u003cli>Penerima arisan ditentukan dengan undian (cabut kartu) atau memakai aplikasi, disaksikan peserta yang hadir.\u003c/li>\u003cli>Peserta yang tidak hadir atau datang terlambat tidak berhak ikut undian pada putaran tersebut.\u003c/li>\u003cli>Setiap peserta hanya mendapat arisan satu kali dalam satu periode.\u003c/li>\u003cli>Hasil undian langsung dicatat dan diumumkan di grup WhatsApp tim.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Pasal 7. Giliran Lewat Kesepakatan\u003c/strong>\u003c/p>\u003col>\u003cli>Peserta yang sedang sangat membutuhkan, misalnya karena sakit, berobat, atau musibah, dapat meminta giliran lebih awal.\u003c/li>\u003cli>Permintaan disampaikan kepada pengurus sebelum pertemuan, lalu dibahas di pertemuan.\u003c/li>\u003cli>Bila disetujui oleh lebih dari setengah peserta yang hadir, putaran itu tidak diundi. Peserta tersebut ditetapkan sebagai penerima, dan keputusan ini dicatat dengan keterangan \"ditetapkan lewat kesepakatan\".\u003c/li>\u003cli>Peserta juga boleh bertukar giliran dengan peserta lain bila keduanya setuju dan dilaporkan kepada pengurus.\u003c/li>\u003c/ol>"}, {"t": "BAB VI. KEWAJIBAN DAN SANKSI", "h": "\u003cp>\u003cstrong>Pasal 8. Kewajiban Peserta\u003c/strong>\u003c/p>\u003col>\u003cli>Peserta yang sudah mendapat arisan tetap wajib menyetor setiap bulan sampai periode selesai.\u003c/li>\u003cli>Peserta yang tidak hadir boleh menitipkan setorannya kepada Bendahara atau peserta lain, dan dikenakan denda sesuai kesepakatan.\u003c/li>\u003cli>Peserta yang keluar sebelum periode selesai wajib melunasi setoran yang belum dibayar. Kewajiban ini berlaku terutama bagi peserta yang sudah mendapat arisan.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Pasal 9. Sanksi\u003c/strong>\u003c/p>\u003col>\u003cli>Denda yang berlaku pada pertemuan arisan (sama dengan Pasal 12 ART Team Terabas):\u003ctable>\u003cthead>\u003ctr>\u003cth>Pelanggaran\u003c/th>\u003cth>Denda\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tidak memakai kostum Team Terabas saat pertemuan\u003c/td>\u003ctd>Rp5.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Datang terlambat\u003c/td>\u003ctd>Rp5.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tidak hadir, setoran dititipkan\u003c/td>\u003ctd>Rp10.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tidak hadir tanpa alasan\u003c/td>\u003ctd>Rp20.000\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tidak hadir dengan alasan khusus yang dapat dipertanggungjawabkan\u003c/td>\u003ctd>Rp0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/li>\u003cli>Denda dibayar pada pertemuan itu juga atau paling lambat pada pertemuan berikutnya, dan masuk ke kas Team Terabas.\u003c/li>\u003cli>Peserta yang tidak hadir atau datang terlambat, walaupun sudah membayar denda, tetap tidak berhak ikut undian pada putaran tersebut.\u003c/li>\u003cli>Peserta yang menunggak setoran 2 (dua) kali berturut-turut ditegur oleh pengurus. Bila tetap menunggak, haknya mengikuti undian ditunda sampai tunggakan lunas.\u003c/li>\u003c/ol>"}, {"t": "BAB VII. PENCATATAN", "h": "\u003cp>\u003cstrong>Pasal 10\u003c/strong>\u003c/p>\u003col>\u003cli>Bendahara mencatat semua setoran dan uang yang diserahkan kepada penerima.\u003c/li>\u003cli>Sekretaris mencatat hasil setiap putaran di aplikasi dan membagikan rekapnya di grup WhatsApp.\u003c/li>\u003c/ol>"}, {"t": "BAB VIII. PENUTUP", "h": "\u003cp>\u003cstrong>Pasal 11\u003c/strong>\u003c/p>\u003col>\u003cli>Hal yang belum diatur dalam peraturan ini diputuskan dalam pertemuan peserta arisan.\u003c/li>\u003cli>Peraturan ini berlaku sejak ditetapkan.\u003c/li>\u003c/ol>\u003cp>Ditetapkan di Kelubagolit (tanggal belum diisi) oleh Ketua Silvanus Bali Ohin, S.Pd.Gr; Sekretaris Antonius Lambertus Asan Boro; Bendahara Mustari Peka Suban, S.Pd.Gr.\u003c/p>"}]}, {"doc": "SK Pengurus", "items": [{"t": "Susunan Pengurus 2026–2030", "h": "\u003cp>Keputusan Ketua Kwartir Ranting Gerakan Pramuka Kelubagolit tentang Pengesahan Susunan Pengurus Team Terabas Kelubagolit Masa Bakti 2026–2030. Ditetapkan di Kelubagolit, 30 Oktober 2026 (nomor belum diisi).\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Jabatan\u003c/th>\u003cth>Nama\u003c/th>\u003cth>Keterangan\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Penasihat\u003c/td>\u003ctd>Videlis Molan Tokan, SST\u003c/td>\u003ctd>Camat Kelubagolit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Penasihat\u003c/td>\u003ctd>Lusius Rangan Belo, S.Pd.SD\u003c/td>\u003ctd>Ketua Kwartir Ranting Kelubagolit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Ketua\u003c/td>\u003ctd>Silvanus Bali Ohin, S.Pd.Gr\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Sekretaris\u003c/td>\u003ctd>Antonius Lambertus Asan Boro\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Bendahara\u003c/td>\u003ctd>Mustari Peka Suban, S.Pd.Gr\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>Anggota Team Terabas Kelubagolit adalah seluruh anggota yang tercatat dalam daftar anggota yang dikelola oleh Sekretaris.\u003c/p>"}, {"t": "Isi Keputusan", "h": "\u003col>\u003cli>\u003cstrong>KESATU:\u003c/strong> Mengesahkan susunan Pengurus Team Terabas Kelubagolit Masa Bakti 2026–2030 sebagaimana tercantum dalam Lampiran.\u003c/li>\u003cli>\u003cstrong>KEDUA:\u003c/strong> Team Terabas Kelubagolit berada di bawah naungan dan pembinaan Kwartir Ranting Gerakan Pramuka Kelubagolit. Segala kegiatan dan pengelolaan organisasi dipertanggungjawabkan kepada Pengurus/Ketua Kwartir Ranting Gerakan Pramuka Kelubagolit.\u003c/li>\u003cli>\u003cstrong>KETIGA:\u003c/strong> Pengurus menjalankan organisasi sesuai AD/ART Team Terabas Kelubagolit, serta melaporkan pelaksanaan tugasnya kepada Ketua Kwartir Ranting Gerakan Pramuka Kelubagolit.\u003c/li>\u003cli>\u003cstrong>KEEMPAT:\u003c/strong> Masa bakti pengurus adalah 4 (empat) tahun, terhitung sejak tanggal ditetapkannya Keputusan ini.\u003c/li>\u003cli>\u003cstrong>KELIMA:\u003c/strong> Keputusan ini berlaku sejak tanggal ditetapkan.\u003c/li>\u003c/ol>"}]}]</script>

function ledger(st){
  const L=[];
  (st.kas||[]).forEach(k=>L.push(Object.assign({src:'kas'},k)));
  Object.keys(st.iuran||{}).forEach(m=>{const v=st.iuran[m];const ids=Object.keys(v.paid||{});const n=ids.length;if(!n)return;const t=v.tgl||thirdSun(m);
    if(v.tim)L.push({id:'iu-t-'+m,tgl:t,arah:'in',dompet:'tim',kategori:'Iuran tim',ket:'Iuran tim '+fYM(m)+' ('+n+' org × '+rp(v.tim)+')',jumlah:n*v.tim,src:'iuran',ref:m});
    if(v.kons)L.push({id:'iu-k-'+m,tgl:t,arah:'in',dompet:'kons',kategori:'Iuran konsumsi',ket:'Uang konsumsi '+fYM(m)+' ('+n+' org × '+rp(v.kons)+')',jumlah:n*v.kons,src:'iuran',ref:m});});
  ((st.arisan||{}).rounds||[]).forEach(r=>{const n=r.setor?r.setor.length:null;const masuk=r.setor?n*r.nominal:r.pot;
    L.push({id:'ar-i-'+r.id,tgl:r.tgl,arah:'in',dompet:'arisan',kategori:'Setoran arisan',ket:'Setoran arisan putaran '+r.no+' (P'+r.period+')'+(r.setor?' – '+n+' org':' – data lama'),jumlah:masuk,src:'arisan'});
    if(r.winnerId)L.push({id:'ar-o-'+r.id,tgl:r.tgl,arah:'out',dompet:'arisan',kategori:'Pembayaran arisan',ket:'Arisan diterima '+r.winnerName+(r.cara==='sepakat'?' (lewat kesepakatan)':''),jumlah:r.pot,src:'arisan',acc:true});});
  (st.denda||[]).forEach(d=>{if(d.lunas&&d.jumlah>0){const m=(st.members.find(x=>x.id===d.memberId)||{}).name||'-';L.push({id:'dn-'+d.id,tgl:d.tglLunas||d.tgl,arah:'in',dompet:'tim',kategori:'Denda',ket:'Denda '+d.jenisL+' – '+m,jumlah:d.jumlah,src:'denda'})}});
  L.sort((a,b)=>a.tgl<b.tgl?-1:a.tgl>b.tgl?1:(a.arah===b.arah?0:a.arah==='in'?-1:1));
  const s=Object.assign({tim:0,kons:0,arisan:0},st.settings.saldoAwal||{});
  L.forEach(e=>{s[e.dompet]+=(e.arah==='in'?1:-1)*e.jumlah;e.saldo=s.tim+s.kons+s.arisan;e.sd=Object.assign({},s)});
  return L;
}

function sumM(L,ym){const o={in:0,out:0,p:{tim:{in:0,out:0},kons:{in:0,out:0},arisan:{in:0,out:0}}};L.forEach(e=>{if(e.tgl.slice(0,7)!==ym)return;o[e.arah]+=e.jumlah;o.p[e.dompet][e.arah]+=e.jumlah});return o}
function saldoAt(L,date){let s=Object.assign({tim:0,kons:0,arisan:0},D.settings.saldoAwal);L.forEach(e=>{if(e.tgl<=date)s=e.sd});return s}

  });

  h+='<div class="card"><span class="lab">Laporan untuk grup WA</span><div class="row"><select id="lap-m" style="flex:1">'+Array.from({length:12},(_,i)=>y+'-'+pad(i+1)).map(k=>'<option value="'+k+'"'+(k===ui.lapM?' selected':'')+'>'+fYM(k)+'</option>').join('')+'<option value="Y'+y+'"'+(ui.lapM==='Y'+y?' selected':'')+'>Setahun '+y+'</option></select><button class="btn" data-a="lapWA">Salin laporan</button></div><small class="note">Tempel di grup WhatsApp tim. Sesuai ART Pasal 14, laporan kas dibagikan setiap pertemuan.</small></div>';
  h+='<div class="card"><span class="lab">Ke spreadsheet</span><div class="row"><button class="btn" data-a="xlsx">Unduh Excel (.xlsx)</button><button class="btn g" data-a="tsv">Salin untuk Google Sheets</button></div><small class="note">File Excel bisa dibuka atau diimpor ke Google Sheets. Tombol salin: buka Google Sheets, klik sel A1, lalu tempel.</small></div>';

V.laporan_mount=()=>{const y=el('lap-y');y&&(y.onchange=()=>{ui.lapY=y.value;ui.lapM=y.value+ui.lapM.slice(4);render()});const m=el('lap-m');m&&(m.onchange=()=>{ui.lapM=m.value})};
function reportText(k){
  const L=ledger(D);let rows,title,sa0,sa1;
  if(k[0]==='Y'){const y=k.slice(1);rows=L.filter(e=>e.tgl.slice(0,4)===y);title='TAHUN '+y;sa0=saldoAt(L,(+y-1)+'-12-31');sa1=saldoAt(L,y+'-12-31')}
  else{rows=L.filter(e=>e.tgl.slice(0,7)===k);title=fYM(k).toUpperCase();sa0=saldoAt(L,shiftYM(k,-1)+'-31');sa1=saldoAt(L,k+'-31')}
  const g={};rows.forEach(e=>{const key=(e.arah==='in'?'+ ':'- ')+e.kategori;g[key]=(g[key]||0)+e.jumlah});
  const tin=rows.filter(e=>e.arah==='in').reduce((a,e)=>a+e.jumlah,0),tout=rows.filter(e=>e.arah==='out').reduce((a,e)=>a+e.jumlah,0);
  const ln=['*LAPORAN KAS TEAM TERABAS*','*'+title+'*','','Saldo awal: '+rp(tot(sa0)),'','*Uang masuk:* '+rp(tin)];
  Object.keys(g).filter(x=>x[0]==='+').forEach(x=>ln.push('• '+x.slice(2)+': '+rp(g[x])));
  ln.push('','*Uang keluar:* '+rp(tout));Object.keys(g).filter(x=>x[0]==='-').forEach(x=>ln.push('• '+x.slice(2)+': '+rp(g[x])));
  if(!tout)ln.push('• -');
  ln.push('','*Saldo akhir: '+rp(tot(sa1))+'*','• Kas Tim: '+rp(sa1.tim),'• Konsumsi: '+rp(sa1.kons),'• Arisan: '+rp(sa1.arisan));
  if(k[0]!=='Y'){const iu=D.iuran[k];if(iu){const un=active().filter(m=>!(iu.paid||{})[m.id]).map(m=>m.name);ln.push('','Iuran belum lunas ('+un.length+'): '+(un.join(', ')||'-'))}}
  const dn=D.denda.filter(d=>!d.lunas&&d.jumlah>0);if(dn.length)ln.push('','Denda belum lunas: '+dn.map(d=>mem(d.memberId).name+' '+rp(d.jumlah)).join(', '));
  if(D.settings.link)ln.push('','Rincian lengkap di aplikasi: '+D.settings.link);
  ln.push('','Bendahara Team Terabas 🤝');
  return ln.join('\n');
}

V.iuran=()=>{
  const k=ui.iuM,iu=D.iuran[k]||{paid:{}},act=active(),st=D.settings;
  const nom=(iu.tim!=null?iu.tim:st.iuranTim)+(iu.kons!=null?iu.kons:st.iuranKons);
  const paid=act.filter(m=>iu.paid&&iu.paid[m.id]);
  let h=head('Iuran Bulanan','Rp'+(st.iuranTim/1000)+'rb iuran tim + Rp'+(st.iuranKons/1000)+'rb konsumsi per orang (ART Pasal 11). Peserta arisan yang menyetor Rp65rb otomatis lunas.');
  h+=ro();
  h+='<div class="seg"><button data-a="iuMode" data-v="bulan" aria-pressed="'+(ui.iuMode==='bulan')+'">Per bulan</button><button data-a="iuMode" data-v="tahun" aria-pressed="'+(ui.iuMode==='tahun')+'">Setahun</button></div>';
  if(ui.iuMode==='tahun'){
    const y=k.slice(0,4);h+='<div class="mnav"><button class="ib" data-a="iuY" data-v="-12" aria-label="Tahun sebelumnya">‹</button><b>'+y+'</b><button class="ib" data-a="iuY" data-v="12" aria-label="Tahun berikutnya">›</button></div>';
    h+='<div class="tw"><table class="mx"><thead><tr><th>Nama</th>'+BLN.map(b=>'<th>'+b.slice(0,3)+'</th>').join('')+'</tr></thead><tbody>'+act.map(m=>'<tr><td>'+esc(m.name)+'</td>'+BLN.map((b,i)=>{const v=D.iuran[y+'-'+pad(i+1)];return v&&v.paid&&v.paid[m.id]?'<td class="y">✓</td>':'<td class="x">·</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>';
    return h;
  }
  h+='<div class="mnav"><button class="ib" data-a="iuPrev" aria-label="Bulan sebelumnya">‹</button><b>'+fYM(k)+'</b><button class="ib" data-a="iuNext" aria-label="Bulan berikutnya">›</button></div>';
  h+='<div class="card"><div class="row nw"><span class="sp"><b>'+paid.length+'</b> dari <b>'+act.length+'</b> anggota lunas</span><b class="in-c">'+rp(paid.length*nom)+'</b></div><div class="bar"><i style="width:'+(act.length?Math.round(paid.length/act.length*100):0)+'%"></i></div><small class="note">Masuk ke Kas Tim '+rp(paid.length*(iu.tim!=null?iu.tim:st.iuranTim))+' dan Konsumsi '+rp(paid.length*(iu.kons!=null?iu.kons:st.iuranKons))+', tanggal '+fD(iu.tgl||thirdSun(k))+'.</small>'+(E?'<div class="row"><button class="btn g sm" data-a="iuAll">Tandai semua lunas</button><button class="btn g sm" data-a="iuWA">Salin daftar untuk WA</button></div>':'<div class="row"><button class="btn g sm" data-a="iuWA">Salin daftar untuk WA</button></div>')+'</div>';
  if(!act.length)return h+'<div class="empty">Belum ada anggota. Tambahkan di menu Anggota.</div>';

  h+='<details class="card"><summary><b>Tunggakan iuran</b> <span class="note">('+tg.length+' anggota · dihitung sejak '+fYM(iuStart())+')</span></summary>'+(tg.length?'<div class="list" style="margin-top:8px">'+tg.map(([m,ks])=>'<div class="it"><div class="m"><b>'+esc(m.name)+'</b><small>'+ks.map(fYM).join(', ')+'</small></div><span class="amt warn-c">'+rp(ks.reduce((a,k)=>a+((D.iuran[k]&&D.iuran[k].tim!=null?D.iuran[k].tim:st.iuranTim)+(D.iuran[k]&&D.iuran[k].kons!=null?D.iuran[k].kons:st.iuranKons)),0))+'</span></div>').join('')+'</div><button class="btn g sm" data-a="tgWA" style="margin-top:8px">Salin tunggakan untuk WA</button>':'<p class="note">Tidak ada tunggakan. Semua lunas.</p>')+'</details>';
  h+='<div class="list">'+act.map(m=>{const ok=iu.paid&&iu.paid[m.id];return E?'<label class="chk"><input type="checkbox" data-iu="'+m.id+'"'+(ok?' checked':'')+'><span class="m">'+esc(m.name)+(m.arisan?' <small class="note">· peserta arisan</small>':'')+'</span><span class="pill '+(ok?'ok':'no')+'">'+(ok?'Lunas':'Belum')+'</span></label>':'<div class="it"><span class="m"><b>'+esc(m.name)+'</b></span><span class="pill '+(ok?'ok':'no')+'">'+(ok?'Lunas':'Belum')+'</span></div>'}).join('')+'</div>';

V.iuran_mount=()=>{document.querySelectorAll('[data-iu]').forEach(c=>c.onchange=()=>{const id=c.dataset.iu,k=ui.iuM,on=c.checked;change((on?'Iuran lunas: ':'Batal iuran: ')+mem(id).name+' ('+fYM(k)+')',d=>setIuran(d,k,id,on))})};
function iuStart(){return (D.settings.iuranMulai||'2026-11')}
function dueMonths(){const out=[];let k=iuStart();const end=thirdSun(curYM())<=today()?curYM():shiftYM(curYM(),-1);let g=0;while(k<=end&&g<120){out.push(k);k=shiftYM(k,1);g++}return out}
function tunggakan(id){return dueMonths().filter(k=>!((D.iuran[k]||{}).paid||{})[id])}
function setIuran(d,k,id,on){const st=d.settings;if(!d.iuran[k])d.iuran[k]={tim:st.iuranTim,kons:st.iuranKons,tgl:thirdSun(k),paid:{}};if(on)d.iuran[k].paid[id]=1;else delete d.iuran[k].paid[id]}

V.arisan=()=>{
  const ar=D.arisan,ps=peserta(),cr=ar.rounds.filter(r=>r.period===ar.period),won=new Set(cr.map(r=>r.winnerId));
  const left=ps.filter(m=>!won.has(m.id));
  let h=head('Arisan','Sukarela, Rp'+(D.settings.arisan/1000)+'rb per putaran (Peraturan Arisan). Setoran Rp65rb sudah termasuk iuran tim dan konsumsi.');

  h+='<div class="row"><span class="lab sp">Riwayat putaran</span><button class="btn g sm" data-a="arWA">Salin rekap WA</button></div>';
  const rs=[...ar.rounds].reverse();
  h+=rs.length?'<div class="list">'+rs.map(r=>'<div class="it"><span class="pill au">P'+r.period+'·'+r.no+'</span><div class="m"><b>'+esc(r.winnerName)+'</b><small>'+fD(r.tgl)+' · '+rp(r.pot)+(r.cara==='sepakat'?' · lewat kesepakatan':'')+(r.setor?' · '+r.setor.length+' menyetor':'')+(r.lama?' · data lama':'')+'</small></div></div>').join('')+'</div>':'<div class="empty">Belum ada putaran.</div>';

function spin(){
  const a=ui.ar,ps=peserta(),won=new Set(D.arisan.rounds.filter(r=>r.period===D.arisan.period).map(r=>r.winnerId));

  if(!ui.abD||ui.abD.t!==t)ui.abD={t,v:clone(rec||Object.fromEntries(act.map(m=>[m.id,{s:'hadir',k:true}])))};

    :'<div class="it"><div class="m"><b>'+esc(m.name)+'</b><small>'+(AB_ST.find(a=>a[0]===x.s)||[0,'-'])[1]+(here&&x.k===false?' · tanpa kostum':'')+'</small></div></div>'}).join('')+'</div>';

function abFines(v){const st=D.settings.denda,get=k=>st.find(x=>x.k===k),out=[];Object.keys(v).forEach(id=>{const m=D.members.find(q=>q.id===id);if(!m||m.aktif===false)return;const x=v[id];

  sheet(n.judul,'<div class="note">'+fD(n.tgl)+'</div><div class="ntext">'+waFmt(n.isi)+'</div>'+((n.lampiran||[]).length?'<div class="lab">Lampiran</div>'+n.lampiran.map(l=>/^image\//.test(l.type||'')?'<a href="'+esc(l.url)+'" target="_blank" rel="noopener"><img src="'+esc(l.url)+'" alt="'+esc(l.name)+'" style="border-radius:10px;border:1px solid var(--line)"></a>':'<a class="btn g" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.name)+'</a>').join(''):'')+'<div class="row"><button class="btn" id="n-wa">Salin untuk WA</button>'+(E?'<button class="btn g" id="n-ed">Ubah</button><button class="btn d" id="n-del">Hapus</button>':'')+'</div>',
  s=>{s.querySelector('#n-wa').onclick=()=>copy('*NOTULEN TEAM TERABAS*\n*'+n.judul+'*\n'+fD(n.tgl)+'\n\n'+n.isi+(D.settings.link?'\n\nArsip notulen: '+D.settings.link:''),'Notulen disalin. Tempel di grup WA.');
    const ed=s.querySelector('#n-ed');ed&&(ed.onclick=()=>ntForm(n));
    const dl=s.querySelector('#n-del');dl&&(dl.onclick=()=>confirmSheet('Hapus notulen?','Notulen <b>'+esc(n.judul)+'</b> akan dihapus.','Ya, hapus',()=>change('Hapus notulen: '+n.judul,d=>{d.notulen=d.notulen.filter(x=>x.id!==n.id)})))});
}
function ntForm(n){
  const isNew=!n;n=n?clone(n):{id:uid(),tgl:today(),judul:'Pertemuan rutin '+fYM(curYM()),isi:'',lampiran:[]};
  sheet(isNew?'Notulen baru':'Ubah notulen',
  '<label class="f">Tanggal<input type="date" id="n-t" value="'+n.tgl+'"></label><label class="f">Judul<input type="text" id="n-j" maxlength="100" value="'+esc(n.judul)+'"></label>'+
  '<div class="card" style="gap:6px"><span class="lab">Ambil dari file</span><input type="file" id="n-f" accept=".docx,.txt"><small class="note">Pilih file Word (.docx) atau .txt. Isinya masuk ke kotak di bawah dan masih bisa diperbaiki.</small></div>'+
  '<label class="f">Isi notulen (bisa tempel dari WA; *tebal* dan _miring_ didukung)<textarea id="n-i">'+esc(n.isi)+'</textarea></label>'+
  (AS?'<label class="f">Lampiran foto/PDF (boleh kosong)<input type="file" id="n-a" accept="image/*,application/pdf" multiple></label>'+(n.lampiran.length?'<div class="note">'+n.lampiran.length+' lampiran tersimpan.</div>':''):'')+
  '<button class="btn w" id="n-ok">Simpan notulen</button>',
  s=>{
    s.querySelector('#n-f').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{let t;if(/\.docx$/i.test(f.name)){toast('Membaca file Word…');const mm=await loadLib(LIB_MAMMOTH,'mammoth');t=(await mm.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}else t=await f.text();s.querySelector('#n-i').value=t.replace(/\n{3,}/g,'\n\n').trim();if(s.querySelector('#n-j').value.startsWith('Pertemuan rutin'))s.querySelector('#n-j').value=f.name.replace(/\.(docx|txt)$/i,'').replace(/[_-]+/g,' ');toast('Isi file dimasukkan')}catch(e){toast('File tidak bisa dibaca. Coba salin-tempel isinya.')}};
    s.querySelector('#n-ok').onclick=async()=>{
      n.tgl=s.querySelector('#n-t').value||today();n.judul=s.querySelector('#n-j').value.trim()||'Notulen';n.isi=s.querySelector('#n-i').value.trim();
      if(!n.isi){toast('Isi notulen masih kosong');return}
      const a=s.querySelector('#n-a');if(a&&a.files.length){for(const f of a.files){const up=await upload(f);if(up)n.lampiran.push(up)}}
      change((isNew?'Tambah':'Ubah')+' notulen: '+n.judul,d=>{if(isNew)d.notulen.push(n);else d.notulen=d.notulen.map(x=>x.id===n.id?n:x)});closeSheet();
    };
  });
}
async function upload(f){if(!E){toast('Masuk sebagai pengurus dulu');return null}if(f.size>8e6){toast('File terlalu besar (maks 8 MB)');return null}try{toast('Mengunggah '+f.name+'…');const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});const r=await apiPost({action:'upload',pin:ls.get('tt_pin'),name:f.name,type:f.type,data:b64});if(!r.ok)throw r;return {id:r.id,url:r.url,name:f.name.slice(0,80),type:f.type}}catch(e){toast('Gagal mengunggah '+f.name);return null}}

/* --- NOTIFIKASI (Firebase) --- */
const FB='https://www.gstatic.com/firebasejs/10.12.2/';
const pushReady=()=>!!(window.TT_FCM&&window.TT_FCM.projectId&&window.TT_VAPID);
const pushSupported=()=>'Notification' in window&&'serviceWorker' in navigator&&'PushManager' in window;
const pushOnHere=()=>!!ls.get('tt_push')&&pushSupported()&&Notification.permission==='granted';
function pushCard(){
  if(!pushReady())return '';
  if(pushOnHere())return '<div class="card"><div class="row nw"><span class="sp"><b>🔔 Notifikasi aktif di HP ini</b><br><small class="note">Pengingat H-1, 1 jam sebelum acara, dan agenda baru akan muncul di HP.</small></span></div>'+(E?'<button class="btn g sm" data-a="pushSend">Kirim pengumuman ke semua HP</button>':'')+'</div>';
  const ios=isIOS&&!isStandalone();
  return '<div class="card" style="border:2px solid var(--gold)"><b>🔔 Aktifkan notifikasi</b><small class="note">'+(ios?'Di iPhone: pasang dulu aplikasi ke <b>Layar Utama</b> (menu Bagikan → Tambah ke Layar Utama), buka dari ikonnya, lalu ketuk tombol ini.':'Supaya HP berbunyi saat ada kegiatan (H-1 dan 1 jam sebelum acara) dan saat ada agenda baru.')+'</small><button class="btn" data-a="pushOn">Aktifkan notifikasi</button>'+(E?'<button class="btn g sm" data-a="pushSend">Kirim pengumuman ke semua HP</button>':'')+'</div>';
}
async function pushOn(){
  if(!pushSupported()){toast(isIOS?'Pasang aplikasi ke Layar Utama dulu, lalu buka dari ikonnya':'HP/browser ini belum mendukung notifikasi. Pakai Chrome.');return}
  if(!API){toast('Alamat server belum diisi');return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Notifikasi belum diizinkan. Buka pengaturan browser → Notifikasi → Izinkan.');return}
    toast('Menyalakan notifikasi…');
    const JD='https://cdn.jsdelivr.net/npm/firebase@10.12.2/';
    await loadLib([FB+'firebase-app-compat.js',JD+'firebase-app-compat.js'],'firebase');
    if(!firebase.messaging){try{await load1(FB+'firebase-messaging-compat.js','firebase')}catch(x){await load1(JD+'firebase-messaging-compat.js','firebase')}}
    if(!firebase.apps.length)firebase.initializeApp(window.TT_FCM);
    const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    const tok=await firebase.messaging().getToken({vapidKey:window.TT_VAPID,serviceWorkerRegistration:reg});
    if(!tok)throw new Error('token');
    const r=await apiPost({action:'sub',token:tok,project:window.TT_FCM.projectId,by:(D.members.find(m=>m.id===ls.get('tt_me'))||{}).name||'',ua:navigator.userAgent.slice(0,120)});
    if(!r.ok)throw new Error(r.code||'server');
    ls.set('tt_push',tok);render();toast('Notifikasi aktif ✓');
  }catch(e){toast('Gagal menyalakan notifikasi ('+(e&&e.message||'error')+'). Periksa sinyal lalu coba lagi.')}
}
function pushSend(){
  sheet('Kirim pengumuman','<p class="note">Pesan langsung muncul di semua HP yang sudah mengaktifkan notifikasi.</p><label class="f">Judul<input type="text" id="ps-t" maxlength="60" value="Team Terabas"></label><label class="f">Isi pesan<textarea id="ps-b" rows="3" maxlength="200" placeholder="Contoh: Besok kumpul jam 16.00 di sekretariat, bawa seragam."></textarea></label><button class="btn w" id="ps-ok">Kirim sekarang</button>',s=>{
    s.querySelector('#ps-ok').onclick=async()=>{const t=s.querySelector('#ps-t').value.trim(),b=s.querySelector('#ps-b').value.trim();if(!b){toast('Isi pesan dulu');return}
      toast('Mengirim…');try{const r=await apiPost({action:'push',pin:ls.get('tt_pin'),title:t||'Team Terabas',body:b});
        if(r.ok){closeSheet();toast('Terkirim ke '+r.sent+' HP'+(r.fail?' ('+r.fail+' gagal)':''))}else toast(r.code==='pin'?'PIN salah':r.code==='notoken'?'Belum ada HP yang mengaktifkan notifikasi':'Gagal: '+(r.err||r.code))}catch(e){toast('Tidak ada sinyal. Coba lagi.')}}})}

/* --- AGENDA --- */
const agList=()=>(D.agenda||[]).slice().sort((a,b)=>(a.tgl+(a.jam||'')).localeCompare(b.tgl+(b.jam||'')));
const agSoon=()=>agList().filter(a=>a.tgl>=today());
const dayDiff=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const agWhen=a=>{const n=dayDiff(a.tgl);return n===0?'Hari ini':n===1?'Besok':n>1&&n<=7?n+' hari lagi':''};
const dtc=(d,j)=>d.replace(/-/g,'')+'T'+(j||'08:00').replace(':','')+'00';
const addMin=(j,mn)=>{const[h,m]=(j||'08:00').split(':').map(Number);const t=h*60+m+mn;return pad(Math.floor(t/60)%24)+':'+pad(t%60)};
function agCal(a){
  const s=dtc(a.tgl,a.jam),e=dtc(a.tgl,a.selesai||addMin(a.jam,120));
  const det=(a.ket?a.ket+'\n\n':'')+'Team Terabas Kelubagolit · Loyalitas Tanpa Batas';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(a.judul)+'&dates='+s+'/'+e+'&details='+encodeURIComponent(det)+'&location='+encodeURIComponent(a.tempat||'')+(a.rrule?'&recur='+encodeURIComponent('RRULE:'+a.rrule):'');
}
function agIcs(a){
  const s=dtc(a.tgl,a.jam),e=dtc(a.tgl,a.selesai||addMin(a.jam,120)),x=t=>String(t||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
  const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const al=(tr,d)=>'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+x(d)+'\r\nTRIGGER:'+tr+'\r\nEND:VALARM\r\n';
  return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Team Terabas//Agenda//ID\r\nCALSCALE:GREGORIAN\r\nBEGIN:VEVENT\r\nUID:'+a.id+'@team-terabas\r\nDTSTAMP:'+st+'\r\nDTSTART:'+s+'\r\nDTEND:'+e+'\r\n'+(a.rrule?'RRULE:'+a.rrule+'\r\n':'')+'SUMMARY:'+x(a.judul)+'\r\nLOCATION:'+x(a.tempat)+'\r\nDESCRIPTION:'+x((a.ket?a.ket+'\n\n':'')+'Team Terabas Kelubagolit')+'\r\n'+al('-P1D','Besok: '+a.judul)+al('-PT1H','1 jam lagi: '+a.judul)+'END:VEVENT\r\nEND:VCALENDAR\r\n';
}
const agRutin=()=>{const j=((D.settings.jadwal||'').match(/(\d{1,2})[.:](\d{2})/)||[0,'17','30']);return {id:'rutin',tgl:nextMeet(),jam:pad(+j[1])+':'+j[2],judul:'Pertemuan rutin Team Terabas',tempat:D.settings.tempat||'',ket:'Pertemuan & arisan bulanan, '+(D.settings.jadwal||'Sabtu minggu ke-3 setiap bulan'),rrule:'FREQ=MONTHLY;BYDAY=3SA'}};
const agWA=a=>'*'+a.judul+'*\n📅 '+['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][new Date(a.tgl+'T00:00:00').getDay()]+', '+fD(a.tgl)+(a.jam?'\n⏰ Pukul '+a.jam.replace(':','.')+(a.selesai?'–'+a.selesai.replace(':','.'):'')+' WITA':'')+(a.tempat?'\n📍 '+a.tempat:'')+(a.ket?'\n\n'+a.ket:'')+'\n\nTeam Terabas · Loyalitas Tanpa Batas';
function agItem(a){const w=agWhen(a);return '<button class="it" data-a="agOpen" data-v="'+a.id+'"><div class="m"><b>'+esc(a.judul)+'</b><small>'+fD(a.tgl)+(a.jam?' · '+a.jam.replace(':','.'):'')+(a.tempat?' · '+esc(a.tempat):'')+'</small></div>'+(w?'<span class="pill'+(dayDiff(a.tgl)<=1?' no':' ok')+'">'+w+'</span>':'<span class="muted">›</span>')+'</button>'}
V.agenda=()=>{
  const up=agSoon(),past=agList().filter(a=>a.tgl<today()).reverse(),r=agRutin();
  let h=head('Agenda Kegiatan','Jadwal kegiatan tim. Aktifkan notifikasi atau ketuk <b>Ingatkan saya</b> supaya HP Anda berbunyi sebelum acara.');
  h+=ro()+pushCard();
  h+='<div class="card" style="border:2px solid var(--gold)"><span class="lab">Pertemuan rutin</span><b>'+esc(D.settings.jadwal||'Sabtu minggu ke-3 setiap bulan, pukul 17.30')+'</b><small class="note">Berikutnya: '+fD(r.tgl)+'. Pasang sekali, pengingat otomatis setiap bulan.</small><button class="btn" data-a="agRemind" data-v="rutin">🔔 Ingatkan saya setiap bulan</button></div>';
  if(E)h+='<button class="btn w" data-a="agAdd">+ Tambah agenda</button>';
  h+='<div class="lab">Akan datang</div>'+(up.length?'<div class="list">'+up.map(agItem).join('')+'</div>':'<div class="empty">Belum ada agenda.'+(E?' Ketuk <b>+ Tambah agenda</b>.':'')+'</div>');
  if(past.length)h+='<details><summary class="lab" style="cursor:pointer">Sudah lewat ('+past.length+')</summary><div class="list">'+past.map(agItem).join('')+'</div></details>';
  return h;
};
function agFind(id){return id==='rutin'?agRutin():(D.agenda||[]).find(x=>x.id===id)}
function agOpen(id){const a=agFind(id);if(!a)return;
  sheet(a.judul,'<div class="kv"><span>Tanggal</span><b>'+fD(a.tgl)+(agWhen(a)?' ('+agWhen(a)+')':'')+'</b><span>Jam</span><b>'+(a.jam?a.jam.replace(':','.')+(a.selesai?'–'+a.selesai.replace(':','.'):''):'-')+'</b><span>Tempat</span><b>'+esc(a.tempat||'-')+'</b></div>'+(a.ket?'<div class="ntext">'+waFmt(a.ket)+'</div>':'')+
  '<button class="btn w" data-a="agRemind" data-v="'+a.id+'">🔔 Ingatkan saya</button><button class="btn g w" id="ag-wa">Salin untuk grup WA</button>'+(E?'<div class="row"><button class="btn g sm" id="ag-ed">Ubah</button><button class="btn d sm" id="ag-del">Hapus</button></div>':''),
  s=>{s.querySelector('#ag-wa').onclick=()=>copy(agWA(a),'Pengumuman disalin. Tempel di grup WA.');const ed=s.querySelector('#ag-ed');ed&&(ed.onclick=()=>agForm(a));const dl=s.querySelector('#ag-del');dl&&(dl.onclick=()=>confirmSheet('Hapus agenda?','Agenda <b>'+esc(a.judul)+'</b> akan dihapus.','Ya, hapus',()=>change('Hapus agenda: '+a.judul,d=>{d.agenda=(d.agenda||[]).filter(x=>x.id!==a.id)})))})}
function agRemind(id){const a=agFind(id);if(!a)return;
  sheet('Ingatkan saya','<p class="note">Acara <b>'+esc(a.judul)+'</b> masuk ke kalender HP Anda'+(a.rrule?' dan berulang setiap bulan':'')+'. HP akan berbunyi sebelum acara, walaupun aplikasi ini tidak dibuka.</p>'+
  '<div class="card"><b>HP Android</b><small class="note">Buka Google Kalender, lalu ketuk <b>Simpan</b>. Supaya diingatkan sehari sebelumnya, ketuk <b>Tambah notifikasi</b> lalu pilih <b>1 hari sebelumnya</b>.</small><a class="btn" href="'+esc(agCal(a))+'" target="_blank" rel="noopener">Buka Google Kalender</a></div>'+
  '<div class="card"><b>iPhone / kalender lain</b><small class="note">Unduh file kalender, buka, lalu ketuk <b>Tambah</b>. Pengingat H-1 dan 1 jam sebelum acara sudah terpasang.</small><button class="btn g" id="ag-ics">Unduh file kalender (.ics)</button></div>',
  s=>{s.querySelector('#ag-ics').onclick=()=>saveFile('agenda-'+(a.id==='rutin'?'pertemuan-rutin':a.tgl)+'.ics',new Blob([agIcs(a)],{type:'text/calendar'}))})}
function agForm(a){const isNew=!a;a=a?clone(a):{id:uid(),tgl:today(),jam:'08:00',selesai:'',judul:'',tempat:'',ket:''};
  sheet(isNew?'Agenda baru':'Ubah agenda','<label class="f">Nama kegiatan<input type="text" id="ag-j" maxlength="100" value="'+esc(a.judul)+'" placeholder="Contoh: Kerja bakti di gereja"></label><label class="f">Tanggal<input type="date" id="ag-t" value="'+a.tgl+'"></label><div class="grid2"><label class="f">Jam mulai<input type="time" id="ag-m" value="'+(a.jam||'')+'"></label><label class="f">Jam selesai (boleh kosong)<input type="time" id="ag-s" value="'+(a.selesai||'')+'"></label></div><label class="f">Tempat<input type="text" id="ag-p" maxlength="100" value="'+esc(a.tempat||'')+'"></label><label class="f">Keterangan (yang perlu dibawa, seragam, dll.)<textarea id="ag-k" rows="4">'+esc(a.ket||'')+'</textarea></label><button class="btn w" id="ag-ok">Simpan agenda</button>',
  s=>{s.querySelector('#ag-ok').onclick=()=>{const g=i=>s.querySelector(i).value.trim();const n={id:a.id,judul:g('#ag-j'),tgl:g('#ag-t'),jam:g('#ag-m'),selesai:g('#ag-s'),tempat:g('#ag-p'),ket:g('#ag-k')};
    if(!n.judul||!n.tgl){toast('Isi nama kegiatan dan tanggal');return}
    change((isNew?'Tambah agenda: ':'Ubah agenda: ')+n.judul+' ('+fD(n.tgl)+')',d=>{d.agenda=d.agenda||[];if(isNew)d.agenda.push(n);else d.agenda=d.agenda.map(x=>x.id===n.id?n:x)});closeSheet();toast('Agenda dicatat. Tekan Simpan.')}})}

/* ===== Ekspor ===== */
function tables(st){
  st=st||D;const L=ledger(st);
  const kas=[['Tanggal','Arah','Dompet','Jenis','Keterangan','Masuk','Keluar','Saldo','Sumber','Disetujui Ketua']].concat(L.map(e=>[e.tgl,e.arah==='in'?'Masuk':'Keluar',POCK[e.dompet],e.kategori,e.ket,e.arah==='in'?e.jumlah:'',e.arah==='out'?e.jumlah:'',e.saldo,{kas:'Manual',iuran:'Iuran',arisan:'Arisan',denda:'Denda'}[e.src],e.arah==='out'?(e.acc?'Ya':'Belum'):'']));
  const years=[...new Set([today().slice(0,4),...L.map(e=>e.tgl.slice(0,4))])].sort();
  const rek=[['Bulan','Masuk','Keluar','Saldo akhir','Kas Tim','Konsumsi','Arisan']];
  years.forEach(y=>{for(let m=1;m<=12;m++){const k=y+'-'+pad(m);if(k>curYM())break;const s=sumM(L,k),sa=saldoAt(L,k+'-31');rek.push([fYM(k),s.in,s.out,tot(sa),sa.tim,sa.kons,sa.arisan])}});
  const iuK=Object.keys(D.iuran).sort();
  const iu=[['Nama'].concat(iuK.map(fYM))].concat(active().map(m=>[m.name].concat(iuK.map(k=>(D.iuran[k].paid||{})[m.id]?'Lunas':'-'))));
  const ar=[['Periode','Putaran','Tanggal','Penerima','Uang arisan','Cara','Jumlah menyetor']].concat(D.arisan.rounds.map(r=>[r.period,r.no,r.tgl,r.winnerName,r.pot,r.cara==='sepakat'?'Kesepakatan':'Undian',r.setor?r.setor.length:'data lama']));
  const dn=[['Tanggal','Nama','Pelanggaran','Jumlah','Status','Tanggal lunas']].concat(D.denda.map(d=>[d.tgl,mem(d.memberId).name,d.jenisL,d.jumlah,d.lunas?'Lunas':'Belum',d.tglLunas||'']));
  const ang=[['Nama','Jabatan','No. WA','Ikut arisan','Status']].concat(D.members.map(m=>[m.name,m.jabatan||'Anggota',m.wa||'',m.arisan?'Ya':'Tidak',m.aktif===false?'Nonaktif':'Aktif']));
  const agd=[['Tanggal','Jam','Selesai','Kegiatan','Tempat','Keterangan']].concat((st.agenda||[]).slice().sort((a,b)=>a.tgl.localeCompare(b.tgl)).map(a=>[a.tgl,a.jam||'',a.selesai||'',a.judul,a.tempat||'',a.ket||'']));
  return {'Agenda':agd,'Buku Kas':kas,'Rekap Bulanan':rek,'Iuran':iu,'Arisan':ar,'Denda':dn,'Anggota':ang};
}
async function saveFile(name,data){try{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('File diunduh: '+name)}catch(e){toast('Gagal mengunduh file')}}
async function exportXlsx(){try{toast('Menyiapkan Excel…');const X=await loadLib(LIB_XLSX,'XLSX');const wb=X.utils.book_new();const T=tables();Object.keys(T).forEach(n=>{const ws=X.utils.aoa_to_sheet(T[n]);ws['!cols']=T[n][0].map((_,i)=>({wch:i===4&&n==='Buku Kas'?42:16}));X.utils.book_append_sheet(wb,ws,n)});const buf=X.write(wb,{type:'array',bookType:'xlsx'});await saveFile('Team-Terabas-'+today()+'.xlsx',new Blob([buf]))}catch(e){toast('Gagal membuat Excel. Periksa internet.')}}

function buildDoc(st){
  const j=s=>s.replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
  '<title>Team Terabas</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONTS+'\n<style id="css">'+el('css').textContent+'</style>\n<div id="app"></div>\n<div id="toast" class="toast" hidden></div>\n'+
  '<script type="application/json" id="data">'+j(JSON.stringify(st))+'<\/script>\n'+
  '<script type="application/json" id="docs">'+el('docs').textContent+'<\/script>\n'+
  '<script type="text/plain" id="logo">'+LOGO+'<\/script>\n'+
  '<script id="main">'+el('main').textContent+'<\/script>\n</body></html>';
}
async function publish(){
  if(!dirty.length||saving)return;
  const pin=ls.get('tt_pin');if(!E||!pin){toast('Masuk sebagai pengurus dulu');return}
  const st=clone(D);st.rev=(S.rev||0)+1;st.updatedAt=new Date().toISOString();st.updatedBy=who();
  saving=true;render();
  let r;try{r=await apiPost({action:'save',pin,baseRev:NET.empty?null:(S.rev||0),state:st,sheets:tables(st)})}catch(e){r={ok:false,code:'net'}}
  saving=false;
  if(r.ok){S=st;D=clone(S);dirty=[];NET.empty=false;ls.del('tt_draft');ls.set('tt_cache',{at:Date.now(),state:S});render();toast('Tersimpan. Semua anggota sekarang melihat data terbaru.');return}
  if(r.code==='conflict'&&r.state){lostNotice=dirty.slice();S=r.state;D=clone(S);dirty=[];ls.del('tt_draft');ls.set('tt_cache',{at:Date.now(),state:S});render();toast('Ada data baru dari pengurus lain. Ulangi perubahan Anda.');return}
  if(r.code==='pin'){E=false;ls.del('tt_pin');render();toast('PIN salah atau sudah diganti. Masuk lagi.');return}
  render();toast(r.code==='net'?'Gagal menyimpan. Periksa sinyal lalu tekan Simpan lagi. Perubahan tetap tersimpan di HP ini.':'Gagal menyimpan ('+(r.code||'error')+').');
}

    kasAll:()=>{ui.kasM=ui.kasM==='all'?curYM():'all';render()},kasAdd:()=>kasForm(null,v),kasOpen:()=>kasOpen(v),

    iuPrev:()=>{ui.iuM=shiftYM(ui.iuM,-1);render()},iuNext:()=>{ui.iuM=shiftYM(ui.iuM,1);render()},iuY:()=>{ui.iuM=shiftYM(ui.iuM,+v);render()},iuMode:()=>{ui.iuMode=v;render()},

    iuWA:()=>{const k=ui.iuM,iu=D.iuran[k]||{paid:{}},act=active();const y=act.filter(m=>iu.paid[m.id]),n=act.filter(m=>!iu.paid[m.id]);copy('*IURAN TEAM TERABAS – '+fYM(k).toUpperCase()+'*\n\n✅ Lunas ('+y.length+'):\n'+(y.map(m=>'• '+m.name).join('\n')||'-')+'\n\n⏳ Belum ('+n.length+'):\n'+(n.map(m=>'• '+m.name).join('\n')||'-')+'\n\nIuran Rp'+((D.settings.iuranTim+D.settings.iuranKons)/1000)+'rb/bulan. Terima kasih 🤝','Daftar iuran disalin')},
    arNew:()=>{const ps=peserta(),won=new Set(D.arisan.rounds.filter(r=>r.period===D.arisan.period).map(r=>r.winnerId));const s={},h={};ps.forEach(m=>{s[m.id]=1;if(!won.has(m.id))h[m.id]=1});ui.ar={tgl:today(),setor:s,hadir:h,pick:null};render()},
    arCancel:()=>{ui.ar=null;render()},arSpin:spin,arReset:()=>{ui.ar.pick=null;render()},
    arSep:()=>{const id=el('ar-sep').value;if(!ui.ar.setor[id]){toast('Centang dulu setorannya');return}ui.ar.pick=id;ui.ar.cara='sepakat';render()},
    arSave:()=>{const a=ui.ar,ps=peserta(),ids=ps.filter(m=>a.setor[m.id]).map(m=>m.id),k=a.tgl.slice(0,7),w=mem(a.pick);
      change('Arisan putaran '+(D.arisan.rounds.filter(r=>r.period===D.arisan.period).length+1)+': '+w.name+' menerima '+rp(ids.length*D.settings.arisan),d=>{const no=d.arisan.rounds.filter(r=>r.period===d.arisan.period).length+1;d.arisan.rounds.push({id:uid(),period:d.arisan.period,no,tgl:a.tgl,pot:ids.length*d.settings.arisan,nominal:d.settings.arisan,setor:ids,winnerId:a.pick,winnerName:w.name,cara:a.cara||'undian'});ids.forEach(id=>setIuran(d,k,id,true))});ui.ar=null;render();toast('Tercatat. Tekan Simpan, lalu salin rekap ke WA.')},
    arUndo:()=>{const cr=D.arisan.rounds.filter(r=>r.period===D.arisan.period),l=cr[cr.length-1];confirmSheet('Batalkan putaran?','Putaran '+l.no+' ('+esc(l.winnerName)+', '+fD(l.tgl)+') akan dihapus. Centang iuran bulan itu tidak ikut dihapus.','Ya, batalkan',()=>change('Batalkan arisan putaran '+l.no+' ('+l.winnerName+')',d=>{d.arisan.rounds=d.arisan.rounds.filter(r=>r.id!==l.id)}))},
    arPeriod:()=>change('Mulai arisan periode '+(D.arisan.period+1),d=>{d.arisan.period++}),
    arWA:()=>{const ar=D.arisan,cr=ar.rounds.filter(r=>r.period===ar.period),won=new Set(cr.map(r=>r.winnerId)),left=peserta().filter(m=>!won.has(m.id));copy('🔥 *REKAP ARISAN TEAM TERABAS* (Periode '+ar.period+')\n\n'+cr.map(r=>r.no+'. '+r.winnerName+' – '+fD(r.tgl)+' – '+rp(r.pot)+(r.cara==='sepakat'?' (kesepakatan)':'')).join('\n')+'\n\nBelum dapat ('+left.length+'): '+(left.map(m=>m.name).join(', ')||'-')+'\n\nPertemuan: '+(D.settings.jadwal||'')+'. Jangan lupa kostum! 🤝','Rekap arisan disalin')},
    angAdd,angOpen:()=>angOpen(v),
    dnAdd:()=>dnForm(null),dnOpen:()=>dnForm(D.denda.find(d=>d.id===v)),dnF:()=>{ui.dnF=v;render()},
    abSave,abGo:()=>{ui.abT=v;render()},
    tgWA:()=>{const st=D.settings,tg=active().map(m=>[m,tunggakan(m.id)]).filter(x=>x[1].length);copy('*TUNGGAKAN IURAN TEAM TERABAS*\n(dihitung sejak '+fYM(iuStart())+')\n\n'+(tg.map(([m,ks])=>'• '+m.name+': '+ks.length+' bln ('+ks.map(k=>BLN[+k.slice(5)-1].slice(0,3)).join(', ')+')').join('\n')||'Tidak ada tunggakan 🎉')+'\n\nIuran Rp'+((st.iuranTim+st.iuranKons)/1000)+'rb/bulan. Mohon dilunasi pada pertemuan berikut. Terima kasih 🤝','Tunggakan disalin')},
    dnTarif:()=>change('Tambah jenis denda',d=>d.settings.denda.push({k:uid(),l:'Jenis denda baru',n:0})),

    doc:()=>{ui.doc=+v;render()},
    setSave,install:installGuide,copyLink:()=>copy(D.settings.link,'Link disalin'),

async function pull(manual){
  if(!API){NET.off=true;render();if(manual)toast('Alamat server belum diisi (config.js)');return}
  try{const r=await apiGet();NET.off=false;NET.sheet=r.sheet||NET.sheet;
    if(r.ok&&r.state){NET.empty=false;if(!S.rev||r.state.rev!==S.rev){if(S.rev&&!manual&&r.state.rev>S.rev&&!dirty.length)setTimeout(()=>toast('Data baru dari pengurus sudah masuk'),50);const keep=dirty.length&&ls.get('tt_draft');S=r.state;if(keep&&keep.rev===S.rev){}else{if(dirty.length)lostNotice=dirty.slice();D=clone(S);dirty=[];ls.del('tt_draft')}}ls.set('tt_cache',{at:Date.now(),state:S,sheet:NET.sheet});NET.at=Date.now()}
    else if(r.ok&&!r.state){NET.empty=true}
    render();if(manual)toast('Data diperbarui')}
  catch(e){NET.off=true;render();if(manual)toast('Tidak ada sinyal. Menampilkan data terakhir.')}
}
(async()=>{
  E=!!ls.get('tt_pin');

  if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
})();
